<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BrainForge Arena</title>

<link rel="stylesheet" href="style.css">

</head>
<body>

<div class="login-box">

<h1>BrainForge Arena</h1>
<h3>Course Completion Test</h3>

<!-- LOGIN -->

<form id="loginForm">

<input
type="email"
id="loginEmail"
placeholder="Email"
required>

<input
type="password"
id="loginPassword"
placeholder="Password"
required>

<button type="submit">
Login
</button>
</form>

<hr>

<!-- REGISTER -->

<h2>Create Account</h2>

<form id="registerForm">

<input
type="text"
id="regName"
placeholder="Full Name"
required>

<input
type="email"
id="regEmail"
placeholder="Email"
required>

<input
type="password"
id="regPassword"
placeholder="Password"
required>

<button type="submit">
Register
</button>

</form>

</div>

<script src="js/auth.js"></script>

</body>
</html>
